<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁGINA NO ENCONTRADA - Play John</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        /* Estructura Flexbox para alinear los dibujos a los lados */
        .error-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 0 auto;
            max-width: 1000px;
            padding: 20px;
        }

        /* Bloque centralizado del número */
        .contenido-central {
            text-align: center;
        }

        .numero-404 {
            font-size: 8rem;
            font-weight: bold;
            color: #ff003c;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 0, 60, 0.6);
            animation: glitch 1s infinite alternate;
        }

        .alerta-icono {
            font-size: 2.5rem;
            margin-bottom: -10px;
        }

        /* Propiedades de las imágenes con las animaciones aplicadas */
        .dibujo-animado {
            width: 150px; 
            height: auto;
            object-fit: contain;
            image-rendering: pixelated; 
            animation: flotarRetro 3s ease-in-out infinite, parpadeoRetro 4s steps(1) infinite;
        }

        /* Desfase para el segundo dibujo (Félix) */
        .error-container img:nth-of-type(2) {
            animation-delay: 1.5s, 0.5s;
        }

        h2.mensaje-titulo {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f0ff;
            margin-top: 20px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        p.mensaje-descripcion {
            color: #aaaaaa;
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 15px auto;
            line-height: 1.6;
        }

        .link-subtexto {
            color: #00f0ff;
            text-decoration: none;
            font-style: italic;
            display: block;
            margin-bottom: 30px;
        }

        .btn-volver {
            display: inline-block;
            background-color: transparent;
            color: #39ff14;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            border: 2px solid #39ff14;
            padding: 12px 30px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            background-color: #39ff14;
            color: #000000;
            box-shadow: 0 0 20px #39ff14;
            transform: translateY(-3px);
        }

        /* Animación 1: Movimiento flotante arriba y abajo */
        @keyframes flotarRetro {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Animación 2: Parpadeo de brillo estilo pantalla antigua */
        @keyframes parpadeoRetro {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3) drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)); }
        }

        /* Animación estilo juego tildado / glitch */
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(3deg); }
            60% { transform: skew(-1deg); }
            80% { transform: skew(2deg); }
            100% { transform: skew(0deg); }
        }

        /* Diseño responsivo para celulares */
        @media (max-width: 768px) {
            .error-container {
                flex-direction: column;
                gap: 20px;
            }
            .dibujo-animado {
                width: 100px;
            }
            .numero-404 {
                font-size: 5rem;
            }
            h2.mensaje-titulo {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <!-- Dibujo Izquierdo (Ralph) -->
       <!-- <img src="https://picsum.photos" alt="Ralph" class="dibujo-animado">-->
        <img src="Imagenes/servicio/ralph.jpg" alt="Ralph" class="dibujo-animado">
        

        <!-- Bloque Central de Texto -->
        <div class="contenido-central">
            <div class="alerta-icono">⚠️</div>
            <h1 class="numero-404">404</h1>
        </div>

        <!-- Dibujo Derecho (Félix) -->
        <img src="Imagenes/servicio/felix.jpg" alt="Félix el Reparador" class="dibujo-animado">
    </div>

    <!-- Bloque inferior de textos y botones -->
    <h2 class="mensaje-titulo">¡GAME OVER PARA ESTA PAGINA</h2>
    <p class="mensaje-descripcion">Ralph pasó corriendo por aquí y demolió el enlace. ¡No te preocupes! Felix ya está usando su martillo mágico para restaurar tu partida.</p>
    <span class="link-subtexto">"Arreglar y reconstruir"</span>

    <!-- Redirección directa a tu home actual de GitHub -->
    <a href="/playjohn/index.html" class="btn-volver">Volver al Inicio</a>

</body>
</html>
