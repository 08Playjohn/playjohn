<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁGINA NO ENCONTRADA - Play John</title>
    <style>
        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        .contenedor-404 {
            padding: 20px;
        }

        .codigo-error {
            font-size: 8rem;
            font-weight: bold;
            color: #ff003c;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 0, 60, 0.6);
            animation: glitch 1s infinite alternate;
        }

        h2 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00f0ff;
            margin-top: 0;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        p {
            color: #aaaaaa;
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }

        .btn-volver {
            display: inline-block;
            background-color: transparent;
            color: #39ff14;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            border: 2px solid #39ff14;
            padding: 12px 30px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
            transition: all 0.3s ease;
        }

        .btn-volver:hover {
            background-color: #39ff14;
            color: #000000;
            box-shadow: 0 0 20px #39ff14;
            transform: translateY(-3px);
        }

        /* Animación estilo juego tildado / glitch */
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-2deg); }
            40% { transform: skew(3deg); }
            60% { transform: skew(-1deg); }
            80% { transform: skew(2deg); }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
<body>

    <div class="contenedor-404">
        <!-- Icono gamer roto o advertencia -->
        <div style="font-size: 4rem; margin-bottom: 10px;">⚠️</div>
        <h1 class="codigo-error">404</h1>
        <h2>¡GAME OVER! Objeto no encontrado</h2>
        <p>Parece que el enlace se rompió o la página que estás buscando fue eliminada de la partida.</p>
        
        <!-- Redirección directa a tu home actual de GitHub -->
        <a href="index.html" class="btn-volver">Volver al Inicio</a>
    </div>

</body>
</html>
