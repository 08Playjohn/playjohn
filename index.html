<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital - Play John</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- Dependencias oficiales de jQuery y Turn.js -->

</head>
<body>

    <div id="wrapper">
        <div id="catalogo">
            
            <!-- PÁGINA 1: PORTADA -->

                <div class="logo-neon">PLAY JOHN</div>

            </div>

            <!-- PÁGINA 2: CATEGORÍA JUEGOS PS4/PS5 -->
           <div class="pagina seccion">
    <div class="tarjeta-juego">
        <img src="Imagenes/GTA V PS5.JPG" alt="GTA V PS5" class="foto-juego">
        <h3>GTA VI (PS5)</h3>
        <p class="descripcion">VEMOS ACA LUEGO QUE PONEMOS SOY LA MEJOR.</p>
        <div class="precio">$75.000</div>
        <span class="badge disponible">DISPONIBLE</span>
    </div>
</div>

    <script>
        // Configuración del efecto revista interactiva
        $(document).ready(function() {
            $("#catalogo").turn({
                width: 900,         // Ancho total (450px por página abierta)
                height: 550,        // Alto del catálogo
                autoCenter: true,   // Centra el libro en la pantalla
                duration: 1000      // Velocidad del giro de hoja (1 segundo)
            });
        });
