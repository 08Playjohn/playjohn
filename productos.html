    <title>* Catálogo de Productos * - Play John</title>

    <!-- FontAwesome para los íconos de carrito -->
    <link rel="stylesheet" href="https://cloudflare.com">

<body style="background-color: #10121a; color: #ffffff; font-family: sans-serif; padding: 20px; margin: 0;">

    <!-- TÍTULO PRINCIPAL Y BUSCADOR -->
    <div style="text-align: center; margin-bottom: 40px; padding-top: 20px;">
        <h1 style="color: #6200ea; text-shadow: 0 0 10px #6200ea; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px;">
            🎮 Catálogo Play John 🎮
        </h1>
        <a href="index.html" style="color: #00f0ff; text-decoration: none; font-weight: bold; font-size: 0.9rem; border: 1px solid #00f0ff; padding: 6px 15px; border-radius: 4px; display: inline-block; margin-bottom: 25px;">

        </a>

        <input type="text" id="buscador-juegos" placeholder="Buscar producto, consola o accesorio..." style="width: 100%; max-width: 450px; padding: 12px 20px; font-size: 1rem; border: 2px solid #3a3f58; border-radius: 25px; background-color: #1b1e2b; color: white; outline: none; transition: 0.3s; box-sizing: border-box;">
    </div>

        <a href="#ps2" style="color: #00f0ff; text-decoration: none; font-size: 0.85rem; font-weight: bold; border: 1px solid #00f0ff; padding: 5px 12px; border-radius: 4px;">PS2</a>

        <a href="#nintendo-switch" style="color: #ff003c; text-decoration: none; font-size: 0.85rem; font-weight: bold; border: 1px solid #ff003c; padding: 5px 12px; border-radius: 4px;">Nintendo Switch</a>
