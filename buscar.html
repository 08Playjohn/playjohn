<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Búsqueda - Play John</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .contenedor-resultados {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: sans-serif;
            color: white;
        }
        .grilla-resultados {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }
        .estado-busqueda {
            text-align: center;
            font-size: 1.2rem;
            color: #00f0ff;
            margin-bottom: 20px;
        }
        /* Estilos base por si tus cartas pierden formato al clonarse */
        .grilla-resultados > * {
            display: block !important;
        }
    </style>
</head>
<body style="background-color: #10121a;">

    <div class="contenedor-resultados">
        <h2>🔍 Resultados de la búsqueda</h2>
        <div id="estado" class="estado-busqueda">Buscando productos...</div>
        
        <!-- Aquí se van a meter los productos filtrados de ambas páginas -->
        <div id="resultados-lista" class="grilla-resultados"></div>
    </div>

    <script>
   <script>
document.addEventListener("DOMContentLoaded", async function () {
    const urlParams = new URLSearchParams(window.location.search);
    const termino = urlParams.get('q');
    const contenedor = document.getElementById('resultados-lista');
    const estado = document.getElementById('estado');

    if (!termino) {
        estado.innerText = "No introdujiste ningún término de búsqueda.";
        return;
    }

    const palabraClave = termino.toLowerCase().trim();
    estado.innerText = `Mostrando resultados para: "${termino}"`;

    // 1. Asegurate de que estos nombres coincidan EXACTAMENTE con tus archivos .html
    const paginas = ['productos.html', 'computacion.html']; 
    let encontrados = 0;

    for (const pagina of paginas) {
        try {
            const respuesta = await fetch(pagina);
            const htmlTexto = await respuesta.text();
            
            const parser = new DOMParser();
            const docTemporal = parser.parseFromString(htmlTexto, 'text/html');

            // 2. Buscamos tus contenedores generales de productos
            const contenedorPrincipal = docTemporal.querySelector('.contenedor-computacion, .contenedor-productos, #contenedor-productos');
            
            let items = [];
            if (contenedorPrincipal) {
                // Si encontramos el contenedor, agarramos todos sus hijos directos (las tarjetas)
                items = Array.from(contenedorPrincipal.children);
            } else {
                // Si no encuentra el contenedor padre, intenta buscar por clases individuales por si acaso
                items = Array.from(docTemporal.querySelectorAll('.producto, .tarjeta, .card, .box, article'));
            }

            items.forEach(item => {
                const textoItem = item.innerText.toLowerCase();
                
                // Si la tarjeta contiene la palabra que busca el usuario
                if (textoItem.includes(palabraClave)) {
                    const clon = item.cloneNode(true);
                    
                    // 3. Corregimos las imágenes para que no se rompan las rutas en la página de búsqueda
                    clon.querySelectorAll('img').forEach(img => {
                        const srcOriginal = img.getAttribute('src');
                        if (srcOriginal && !srcOriginal.startsWith('http') && !srcOriginal.startsWith('/')) {
                            img.src = srcOriginal; // Mantiene la ruta relativa correcta
                        }
                    });

                    contenedor.appendChild(clon);
                    encontrados++;
                }
            });

        } catch (error) {
            console.error(`Error al buscar en la página ${pagina}:`, error);
        }
    }

    if (encontrados === 0) {
        estado.innerHTML = `❌ No se encontraron productos que coincidan con "${termino}".`;
    }
});
</script>

</body>
</html>
