<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Búsqueda - Play John</title>
    <link rel="stylesheet" href="estilos.css">
    <!-- Iconos para el botón de comprar -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        .contenedor-resultados {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: sans-serif;
            color: white;
        }
        .grilla-resultados {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
        }
        .estado-busqueda {
            text-align: center;
            font-size: 1.2rem;
            color: #00f0ff;
            margin-bottom: 20px;
        }
        /* Clase base para que tus tarjetas mantengan el diseño de tu web */
        .tarjeta-producto-dinamica {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 20px;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body style="background-color: #10121a;">

    <div class="contenedor-resultados">
        <h2>🔍 Resultados de la búsqueda</h2>
        <div id="estado" class="estado-busqueda">Buscando productos en Drive...</div>
        
        <!-- Aquí se inyectarán las tarjetas filtradas -->
        <div id="resultados-lista" class="grilla-resultados"></div>

        <!-- BOTÓN INTEGRADO PARA VOLVER A LA PÁGINA INICIAL -->
        <div style="text-align: center; margin-top: 50px;">
            <a href="index.html" style="
                display: inline-block;
                padding: 12px 28px;
                background-color: #00f0ff;
                color: #10121a;
                text-decoration: none;
                font-family: sans-serif;
                font-weight: bold;
                border-radius: 6px;
                box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
                transition: transform 0.2s;
            " onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
                🏠 Volver al Inicio
            </a>
        </div>
    </div>

    <script>
    // 1. PEGA AQUÍ TU URL REAL DE GOOGLE SHEETS / DRIVE (la misma que usás en computacion.html)
    const URL_DRIVE_RESPALDO = "https://script.google.com/macros/s/AKfycbwqPdUzWDOJAtaputLJC2ebosxGuLkrkBxOFQu08PxvhenV3iUEcYYV2hGLdhJl5-Kx/exec";

    document.addEventListener("DOMContentLoaded", async function () {
        const urlParams = new URLSearchParams(window.location.search);
        const termino = urlParams.get('q');
        const contenedor = document.getElementById('resultados-lista');
        const estado = document.getElementById('estado');

        if (!termino) {
            estado.innerText = "No introdujiste ningún término de búsqueda.";
            return;
        }

        const palabraClave = termino.toLowerCase().trim();
        estado.innerText = `Mostrando resultados para: "${termino}"`;

        try {
            // Hacemos la petición directa a tu fuente de datos de Drive
            const respuesta = await fetch(URL_DRIVE_RESPALDO);
            if (!respuesta.ok) throw new Error("No se pudo conectar con Google Drive");
            
            // Adaptá esto según si tu script lee .json() o si procesa texto/CSV
            const productos = await respuesta.json(); 
            
            let encontrados = 0;
            contenedor.innerHTML = ""; // Limpiamos el contenedor

            productos.forEach(producto => {
                const nombre = producto.nombre || "";
                const descripcion = producto.descripcion || "";

                // Filtramos de forma inteligente si coincide en nombre o descripción
                if (nombre.toLowerCase().includes(palabraClave) || descripcion.toLowerCase().includes(palabraClave)) {
                    
                    // Creamos la tarjeta usando exactamente tu misma estructura HTML nativa
                    const nuevaTarjeta = document.createElement('div');
                    // Cambiá esta clase por la clase exacta que le ponés a tus tarjetas en tu script original si pierden estilos
                    nuevaTarjeta.className = 'tarjeta-producto-dinamica'; 

                    nuevaTarjeta.innerHTML = `
                        <div style="width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; background-color: #ffffff; margin-bottom: 15px;">
                            <img src="${producto.imagen || 'Imagenes/servicio/placeholder.jpg'}" alt="${producto.nombre}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                        </div>
                        <h3 style="color: #0b0c10 !important; margin: 0 0 10px 0; font-size: 1.15rem; font-weight: bold; text-align: center; text-transform: uppercase; width: 100%; line-height: 1.3;">
                            ${producto.nombre}
                        </h3>
                        <p class="descripcion" style="color: #333333 !important; font-size: 0.9rem; text-align: center; line-height: 1.4; margin: 0 0 15px 0; min-height: 60px; width: 100%;">
                            ${producto.descripcion || ''}
                        </p>
                        <div class="precio" style="font-size: 1.6rem; font-weight: bold; color: #00ff37; text-align: center; margin-bottom: 15px;">
                            $${parseFloat(producto.precio).toLocaleString('es-AR')}
                        </div>
                        <span class="badge disponible" style="background-color: #00ff66; color: #000000; font-size: 0.75rem; font-weight: bold; padding: 6px 16px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: inline-block; text-align: center;">
                            DISPONIBLE
                        </span>
                        <button class="boton-wpp btn-agregar-carrito" 
                                data-nombre="${producto.nombre}" 
                                data-precio="${producto.precio}" 
                                style="width: 100% !important; padding: 12px !important; font-size: 1rem !important; background-color: #1dd1a1; color: #ffffff; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <i class="fa-solid fa-cart-plus"></i> Comprar
                        </button>
                    `;

                    contenedor.appendChild(nuevaTarjeta);
                    encontrados++;
                }
            });

            // Mensaje final de control
            if (encontrados === 0) {
                estado.innerHTML = `❌ No se encontraron productos que coincidan con "${termino}".`;
            } else {
                estado.innerHTML = `✅ ¡Se encontraron ${encontrados} productos de computación y consolas!`;
            }

        } catch (error) {
            console.error("Error en el buscador de Drive:", error);
            estado.innerHTML = "❌ Hubo un inconveniente al conectar con la base de datos de Google Drive.";
        }
    });
    </script>
</body>
</html>
