<body style="background-color: #10121a;">

    <div class="contenedor-resultados">
        <h2>🔍 Resultados de la búsqueda</h2>
        <div id="estado" class="estado-busqueda">Buscando productos...</div>
        
        <!-- Contenedor donde se inyectarán los resultados -->
        <div id="resultados-lista" class="grilla-resultados"></div>

        <!-- BOTÓN PARA VOLVER A LA PÁGINA INICIAL -->
        <div style="text-align: center; margin-top: 40px;">
            <a href="index.html" style="
                display: inline-block;
                padding: 12px 24px;
                background-color: #00f0ff;
                color: #10121a;
                text-decoration: none;
                font-family: sans-serif;
                font-weight: bold;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
                transition: transform 0.2s, box-shadow 0.2s;
            " onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
                🏠 Volver al Inicio
            </a>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", async function () {
        const urlParams = new URLSearchParams(window.location.search);
        const termino = urlParams.get('q');
        const contenedor = document.getElementById('resultados-lista');
        const estado = document.getElementById('estado');

        if (!termino) {
            estado.innerText = "No introdujiste ningún término de búsqueda.";
            return;
        }

        const palabraClave = termino.toLowerCase().trim();
        estado.innerText = `Mostrando resultados para: "${termino}"`;

        try {
            // 1. REEMPLAZA ESTA URL POR TU ENLACE REAL DE GOOGLE DRIVE / API / SHEETS
            // Debe ser la misma URL que usás en computacion.html para traer tus tarjetas.
            const urlDriveData = "https://script.google.com/macros/s/AKfycbwqPdUzWDOJAtaputLJC2ebosxGuLkrkBxOFQu08PxvhenV3iUEcYYV2hGLdhJl5-Kx/exec"; 
            
            const respuesta = await fetch(urlDriveData);
            const productos = await respuesta.json(); // O .text() dependiendo de tu formato original
            
            let encontrados = 0;
            contenedor.innerHTML = ""; // Limpiamos pantalla

            // 2. Ajustá este bucle según cómo venga estructurado tu archivo de Drive
            // Supongamos que es un array de productos:
            productos.forEach(prod => {
                const nombreProducto = prod.nombre || ""; // Cambiá 'nombre' por tu propiedad real de Drive
                const descripcionProducto = prod.descripcion || ""; 

                if (nombreProducto.toLowerCase().includes(palabraClave) || descripcionProducto.toLowerCase().includes(palabraClave)) {
                    
                    // 3. ARMÁ TU TARJETA ACÁ: Copiá la misma estructura HTML exacta 
                    // que genera tu script original de computación/consolas.
                    contenedor.innerHTML += `
                        <div class="producto" style="border: 1px solid #333; padding: 15px; border-radius: 8px;">
                            <img src="${prod.imagen}" alt="${nombreProducto}" style="max-width:100%;">
                            <h3>${nombreProducto}</h3>
                            <p>${descripcionProducto}</p>
                            <span style="color:#00f0ff;">$${prod.precio}</span>
                        </div>
                    `;
                    encontrados++;
                }
            });

            if (encontrados === 0) {
                estado.innerHTML = `❌ No se encontraron productos que coincidan con "${termino}".`;
            } else {
                estado.innerHTML = `✅ ¡Se encontraron ${encontrados} productos!`;
            }

        } catch (error) {
            console.error("Error obteniendo datos desde Google Drive:", error);
            estado.innerHTML = "❌ Hubo un error de conexión con la base de datos de productos.";
        }
    });
    </script>
</body>

</html>
